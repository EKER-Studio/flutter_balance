# This file configures the analyzer, which statically analyzes Dart code to
# check for errors, warnings, and lints.
#
# The issues identified by the analyzer are surfaced in the UI of Dart-enabled
# IDEs (https://dart.dev/tools#ides-and-editors). The analyzer can also be
# invoked from the command line by running `flutter analyze`.

# The following line activates a set of recommended lints for Flutter apps,
# packages, and plugins designed to encourage good coding practices.
include: package:flutter_lints/flutter.yaml

plugins:
  import_lint: ^2.0.0

analyzer:
  # Exclude generated Isar schema files from analysis. The isar_community
  # generator (v3.3.2) emits calls to @experimental index-manipulation APIs
  # that produce spurious warnings in hand-written code analysis runs.
  # These files are never edited by hand and are regenerated on every
  # `build_runner` invocation, so suppressing them here is safe.
  exclude:
    - "**/*.g.dart"
    # Flutter generated
    - ".dart_tool/**"
    - "build/**"
    # Swift Package Manager
    - "ios/Pods/**"
    - "build/ios/**"
    # Android
    - "android/**"

import_lint:
  rules:
    avoid_infrastructure_imports_in_presentation:
      target: "package:flutter_bloc_boilerplate/features/**/presentation/**"
      from: "package:flutter_bloc_boilerplate/features/**/data/**"
      except: []
      severity: error