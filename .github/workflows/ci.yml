name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verification:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.47.0'

      - name: Install dependencies
        run: flutter pub get

      - name: Fetch Isar core binary for native tests
        run: |
          ISAR_VERSION=$(awk '/isar_community:/{flag=1; next} flag && /version:/{print $2; exit}' pubspec.lock | tr -d '"')
          echo "Using Isar version: $ISAR_VERSION"
          curl -fsSL "https://binaries.isar-community.dev/${ISAR_VERSION}/libisar_linux_x64.so" -o libisar.so

      - name: Generate localization files (i18n)
        run: flutter gen-l10n

      - name: Run code generation (Build Runner)
        run: dart run build_runner build

      - name: Check formatting
        run: dart format --set-exit-if-changed lib test

      - name: Static analysis
        run: flutter analyze | perl -pe 's/\x1b\[[0-9;]*[a-zA-Z]//g' | grep -q "No issues found!" || (echo "Lint issues found!" && exit 1)

      - name: Run unit and widget tests
        run: flutter test --exclude-tags golden
