name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verification:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.47.0'

      - name: Install dependencies
        run: flutter pub get

      - name: Restore Firebase configuration or generate CI stub
        run: |
          if [ -n "${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON_BASE64 }}" ]; then
            echo "${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON_BASE64 }}" | base64 --decode > android/app/google-services.json
          elif [ ! -f "android/app/google-services.json" ]; then
            mkdir -p android/app
            echo '{"project_info":{"project_number":"1234567890","project_id":"dummy-ci-project","storage_bucket":"dummy-ci-project.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:1234567890:android:dummyappid","android_client_info":{"package_name":"com.ekerstudio.balance"}},"oauth_client":[],"api_key":[{"current_key":"dummy_api_key"}],"services":{}}],"configuration_version":"1"}' > android/app/google-services.json
          fi

          if [ -n "${{ secrets.FIREBASE_GOOGLE_SERVICE_INFO_PLIST_BASE64 }}" ]; then
            echo "${{ secrets.FIREBASE_GOOGLE_SERVICE_INFO_PLIST_BASE64 }}" | base64 --decode > ios/Runner/GoogleService-Info.plist
          elif [ ! -f "ios/Runner/GoogleService-Info.plist" ]; then
            mkdir -p ios/Runner
            echo '<?xml version="1.0" encoding="UTF-8"?><!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd"><plist version="1.0"><dict><key>API_KEY</key><string>dummy_api_key</string><key>GCM_SENDER_ID</key><string>1234567890</string><key>PLIST_VERSION</key><string>1</string><key>BUNDLE_ID</key><string>com.ekerstudio.balance</string><key>PROJECT_ID</key><string>dummy-ci-project</string><key>STORAGE_BUCKET</key><string>dummy-ci-project.appspot.com</string><key>GOOGLE_APP_ID</key><string>1:1234567890:ios:dummyappid</string></dict></plist>' > ios/Runner/GoogleService-Info.plist
          fi

          if [ -n "${{ secrets.FIREBASE_OPTIONS_DART_BASE64 }}" ]; then
            echo "${{ secrets.FIREBASE_OPTIONS_DART_BASE64 }}" | base64 --decode > lib/firebase_options.dart
          elif [ ! -f "lib/firebase_options.dart" ]; then
            echo "" | base64 --decode > lib/firebase_options.dart
          fi

      - name: Fetch Isar core binary for native tests
        run: |
          ISAR_VERSION=$(awk '/isar_community:/{flag=1; next} flag && /version:/{print $2; exit}' pubspec.lock | tr -d '"')
          echo "Using Isar version: $ISAR_VERSION"
          curl -fsSL "https://binaries.isar-community.dev/${ISAR_VERSION}/libisar_linux_x64.so" -o libisar.so

      - name: Generate localization files (i18n)
        run: flutter gen-l10n

      - name: Run code generation (Build Runner)
        run: dart run build_runner build

      - name: Check formatting
        run: dart format --set-exit-if-changed lib test

      - name: Static analysis
        run: flutter analyze

      - name: Run unit and widget tests
        run: flutter test --exclude-tags golden
