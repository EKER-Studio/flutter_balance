name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verification:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.44.8'
          cache: true

      - name: Cache Pub dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-cache-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            pub-cache-${{ runner.os }}-

      - name: Cache Build Runner / native artifacts
        uses: actions/cache@v4
        with:
          path: .dart_tool
          key: dart-tool-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            dart-tool-${{ runner.os }}-

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localization files (i18n)
        run: flutter gen-l10n

      - name: Run code generation (Build Runner)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Check formatting
        run: dart format --set-exit-if-changed lib test

      - name: Static analysis
        run: flutter analyze | perl -pe 's/\x1b\[[0-9;]*[a-zA-Z]//g' | grep -q "No issues found!" || (echo "Lint issues found!" && exit 1)

      - name: Import lint layer guardrail
        run: |
          IMPORT_LINT_OUTPUT="$(dart run import_lint 2>&1)"
          import_lint_status=$?
          echo "$IMPORT_LINT_OUTPUT"
          CLEANED_IMPORT_LINT_OUTPUT="$(echo "$IMPORT_LINT_OUTPUT" | perl -pe 's/\x1b\[[0-9;]*[a-zA-Z]//g')"
          if [[ $import_lint_status -ne 0 ]]; then
            echo "::error::import_lint exited with status $import_lint_status"
            exit "$import_lint_status"
          fi
          if echo "$CLEANED_IMPORT_LINT_OUTPUT" | grep -qE "([1-9][0-9]* issues? found|Violation|[1-9][0-9]* errors?)"; then
            echo "::error::import_lint reported architecture boundary violations (see log above)"
            exit 1
          fi
          if ! echo "$CLEANED_IMPORT_LINT_OUTPUT" | grep -q "No issues found"; then
            echo "::error::import_lint did not confirm zero issues."
            exit 1
          fi

      - name: Run unit and widget tests
        run: flutter test -j 1 --exclude-tags golden

      - name: Verify Android Build
        run: flutter build apk --debug

      - name: Upload Android Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7