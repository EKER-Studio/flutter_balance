name: Bug report
description: Report a bug
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting! Please fill in the details.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened and what did you expect?
      placeholder: Steps, expected vs actual
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Tap ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
      placeholder: e.g. 1.1.0+7
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: [Android, iOS, Both]
  - type: textarea
    id: logs
    attributes:
      label: Logs / Screenshots
      render: shell
