name: balance
description: "Balance — a local-first weight tracking app."
publish_to: 'none'

version: 1.2.0+9

environment:
  sdk: ^3.12.2
  flutter: ^3.47.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  flutter_bloc: ^9.1.1
  equatable: ^2.0.7
  hydrated_bloc: ^11.0.0
  isar_community: ^3.3.2
  isar_community_flutter_libs: ^3.3.2
  path_provider: ^2.1.6
  intl: ^0.20.3
  go_router: ^14.8.1
  fl_chart: ^1.2.0
  csv: ^8.0.0
  file_picker: ^11.0.2
  flutter_local_notifications: ^22.1.0
  local_auth: ^3.0.2
  # Platform-specific auth messages (AndroidAuthMessages, IOSAuthMessages) & interface
  local_auth_android: ^2.0.0
  local_auth_darwin: ^2.0.0
  local_auth_platform_interface: ^1.1.0
  timezone: ^0.11.1
  flutter_timezone: ^3.0.1
  permission_handler: ^11.4.0
  encrypt: ^5.0.3
  crypto: ^3.0.6
  flutter_secure_storage: ^10.3.1
  flutter_native_splash: ^2.4.6
  share_plus: ^10.1.4
  package_info_plus: ^9.0.1
  device_info_plus: ^12.1.0
  health: ^13.3.1
  url_launcher: ^6.3.2
  path: ^1.9.0
  bloc_concurrency: ^0.3.0
  get_it: ^8.0.3
  injectable: ^2.5.0
  firebase_core: ^3.12.1
  firebase_crashlytics: ^4.3.3
  firebase_analytics: ^11.4.3
  home_widget: ^0.9.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  mocktail: ^1.0.5
  path_provider_platform_interface: ^2.1.2

  bloc_test: ^10.0.0
  flutter_lints: ^6.0.0
  build_runner: ^2.15.1
  isar_community_generator: ^3.3.2
  injectable_generator: ^2.7.0
  flutter_launcher_icons: ^0.14.1
  # Platform interface mock support in unit and widget test environments.
  permission_handler_platform_interface: ^4.4.0

flutter:
  generate: true
  uses-material-design: true

  # Application assets.
  assets:
    - assets/icon/splash_light.png
    - assets/icon/splash_dark.png
    - assets/icon/app_icon_foreground.png

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true

  # 1. Standard Icon (iOS Light Mode / Legacy iOS / Fallback)
  image_path: "assets/icon/app_icon.png"

  # 2. iOS 18+ Dark Mode
  image_path_ios_dark: "assets/icon/app_icon_dark.png"

  # 3. iOS 18+ Tinted Mode
  image_path_ios_tinted: "assets/icon/app_icon_monochrome.png"
  
  # Android Adaptive Icons (API 26+)
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"

  # Android 13+ Dynamic Themed Icons (Material You)
  adaptive_icon_monochrome: "assets/icon/app_icon_monochrome.png"

flutter_native_splash:
  color: "#FDF7FF"
  color_dark: "#141218"

  image: "assets/icon/splash_light.png"
  image_dark: "assets/icon/splash_dark.png"

  android_12:
    image: "assets/icon/splash_light.png"
    image_dark: "assets/icon/splash_dark.png"
    icon_background_color: "#FDF7FF"
    icon_background_color_dark: "#141218"

  android: true
  ios: true
